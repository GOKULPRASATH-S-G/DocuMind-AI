version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: doc_rag_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-doc_rag_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: doc_rag_chromadb
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doc_rag_backend
    restart: always
    ports:
      - "8001:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@database:5432/${POSTGRES_DB:-doc_rag_db}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - JWT_SECRET=${JWT_SECRET:-production-jwt-secret-key-32-chars-long}
      - CHROMA_PERSIST_DIR=/app/backend/chroma_data
      - STORAGE_LOCAL_DIR=/app/backend/uploaded_files
    volumes:
      - storage_data:/app/backend/uploaded_files
      - chroma_data:/app/backend/chroma_data
    depends_on:
      database:
        condition: service_healthy

volumes:
  postgres_data:
  chroma_data:
  storage_data:
