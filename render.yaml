services:
  # 1. FastAPI Backend Web Service (Docker Runtime with Tesseract OCR)
  - type: web
    name: documind-backend
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: DATABASE_URL
        value: sqlite:///./doc_rag.db
      - key: ALLOWED_ORIGINS
        value: "*"

  # 2. React Vite Frontend Static Site
  - type: web
    name: documind-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: documind-backend
          property: host
