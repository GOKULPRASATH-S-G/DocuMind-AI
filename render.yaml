services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: documind-backend
    env: python
    rootDir: backend
    buildCommand: "apt-get update && apt-get install -y tesseract-ocr && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: DATABASE_URL
        value: sqlite:///./doc_rag.db
      - key: ALLOWED_ORIGINS
        value: "*"

  # 2. React Vite Frontend Static Site
  - type: web
    name: documind-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: documind-backend
          property: host
